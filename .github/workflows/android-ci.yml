name: Android Debug APK / Simulation Tests
on:
  push:
    branches: [main, 'codex/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Simulationstests
        run: |
          node --check app/src/main/assets/map.js
          node --check app/src/main/assets/audio.js
          node --check app/src/main/assets/game.js
          node tests/simulation.test.cjs
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Einsatzleitstelle110-GeoAlpha04-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
