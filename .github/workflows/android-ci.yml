name: Native Android APK and device verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build and lint native app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Audit real APK contents
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Einsatzleitstelle110-Native-Leitstelle.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk release/instrumentation.apk
          python3 scripts/verify_native_apk.py release/Einsatzleitstelle110-Native-Leitstelle.apk > release/package-audit.json
          sha256sum release/Einsatzleitstelle110-Native-Leitstelle.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Einsatzleitstelle110-native-build
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-unit-and-lint-evidence
          path: |
            app/build/test-results/
            app/build/reports/
  device:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Einsatzleitstelle110-native-build
          path: release/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline device workflow and real screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p runtime
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r release/Einsatzleitstelle110-Native-Leitstelle.apk
            adb install -r release/instrumentation.apk
            adb shell am instrument -w -r de.einsatzleitstelle110.test/androidx.test.runner.AndroidJUnitRunner | tee runtime/instrumentation.txt
            adb exec-out screencap -p > runtime/device-final.png
            adb logcat -d > runtime/logcat.txt
            adb shell dumpsys activity lastanr > runtime/last-anr.txt
            python3 -c "from pathlib import Path; t=Path('runtime/instrumentation.txt').read_text(); assert 'OK (' in t and 'FAILURES!!!' not in t, t"
            for FILE in native-wandsbek.png native-officer.png native-equipment.png native-24h-report.png native-niedersachsen.png native-bayern.png; do
              adb exec-out run-as de.einsatzleitstelle110 cat /sdcard/Android/data/de.einsatzleitstelle110/files/$FILE > runtime/$FILE
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-screenshots
          path: runtime/
          if-no-files-found: warn
  deliver:
    if: github.event_name == 'push'
    needs: [build, device]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Einsatzleitstelle110-native-build
          path: release/
      - name: Upload verified native preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=operator-native-v2-preview
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Einsatzleitstelle110-Native-Leitstelle.apk release/SHA256SUMS.txt release/package-audit.json --clobber
          else
            gh release create "$TAG" release/Einsatzleitstelle110-Native-Leitstelle.apk release/SHA256SUMS.txt release/package-audit.json --target "$GITHUB_SHA" --prerelease --title "Native Leitstelle: neue Grafik, Bezirke und persönliche Ausstattung" --notes-file docs/NATIVE_PREVIEW_RELEASE.md
          fi
