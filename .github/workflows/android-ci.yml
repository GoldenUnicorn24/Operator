name: Android Debug APK
on:
  push:
    branches: [main, 'codex/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck and simulation tests
        run: npm test
      - name: Bundle offline game
        run: npm run build:web
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows and screenshots
        run: npm run test:ui
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build and lint debug APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Einsatzleitstelle110-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload UI and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-results/
            playwright-report/
            docs/evidence/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build:web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline start, legacy save migration, lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/outputs/runtime
            adb pull /sdcard/Android/data/de.einsatzleitstelle110/files/android-start.png app/build/outputs/runtime/android-start.png
            adb pull /sdcard/Android/data/de.einsatzleitstelle110/files/android-niedersachsen.png app/build/outputs/runtime/android-niedersachsen.png
            adb pull /sdcard/Android/data/de.einsatzleitstelle110/files/android-24h-report.png app/build/outputs/runtime/android-24h-report.png
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/runtime/
          if-no-files-found: warn
