name: Publish installable Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK platforms and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check JavaScript and run simulation tests
        run: |
          node --check app/src/main/assets/game.js
          node --check app/src/main/assets/map.js
          node --check app/src/main/assets/audio.js
          node tests/simulation.test.cjs
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Einsatzleitstelle110-Operator-Alpha05.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Archive APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: Einsatzleitstelle110-Operator-Alpha05-APK
          path: release/
          if-no-files-found: error
      - name: Upload APK directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.5.0-operator-alpha
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "EINSATZLEITSTELLE 110 — Operator Alpha 0.5 (Android)" \
              --notes "Installierbare Android-Debug-APK. Die Livekarte nimmt auf Smartphones mehr Platz ein; vollständige Bundesland-Gesamtansichten, Einheiten, Notrufe, 8/12/24-Stunden-Schichten, Training und Ausrüstung. Die Fahrwege sind derzeit Simulation, noch keine echten Straßendaten. Nicht Play-Store-signiert; Test auf Gerät empfohlen." \
              --prerelease
          fi
