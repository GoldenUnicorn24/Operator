name: Render voice clips
on:
  push:
    branches: ['claude/**']
    paths: ['tools/voices/**', '.github/workflows/voices.yml']
permissions:
  contents: write
concurrency:
  group: voices-${{ github.ref }}
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install piper-tts==1.2.0
      - name: Render
        run: python3 tools/voices/render.py
      - name: Commit clips
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/native_assets/voices
          git diff --cached --quiet || git commit -qm 'voices: render clips [skip ci]'
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
