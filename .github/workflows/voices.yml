name: Render voice clips
on:
  push:
    branches: ['claude/**']
    paths: ['tools/voices/**', '.github/workflows/voices.yml']
permissions:
  contents: write
concurrency:
  group: voices-${{ github.ref }}
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild native voice manifest
        run: VOICE_MANIFEST=write ./gradlew --no-daemon :app:testDebugUnitTest --tests de.einsatzleitstelle110.NativePhoneDeskTest.voiceManifestIsInStep
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install piper-tts==1.2.0
      - name: Render
        run: python3 tools/voices/render.py
      - name: Commit clips
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/voices/lines.tsv app/src/main/native_assets/voices
          git diff --cached --quiet || git commit -qm 'voices: render clips [skip ci]'
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
