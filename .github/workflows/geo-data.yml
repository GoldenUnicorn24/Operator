name: Build offline geo base (Natural Earth)
on:
  push:
    branches: ['claude/**']
    paths: ['tools/build_geo_base.py', '.github/workflows/geo-data.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geo:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry tooling
        run: pip install 'shapely>=2.0' pyshp
      - name: Build Germany base map from public-domain Natural Earth
        run: python3 tools/build_geo_base.py
      - name: Commit generated asset
        run: |
          git config user.name "geo-data-bot"
          git config user.email "geo-data-bot@users.noreply.github.com"
          git add app/src/main/native_assets/geo/
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "geo: regenerate offline Natural Earth base map [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
