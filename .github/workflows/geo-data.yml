name: Build offline geo base (Natural Earth)
on:
  push:
    branches: ['claude/**', 'codex/operator-v1-polizeichef']
    paths: ['tools/build_geo_base.py', 'tools/build_osm_roads.py', 'tools/pack_geo.py', 'tools/tests/**', '.github/workflows/geo-data.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geo:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry tooling
        run: pip install 'shapely>=2.0' pyshp
      - name: Build Germany base map from public-domain Natural Earth
        run: |
          if [ -f app/src/main/native_assets/geo/germany-base.json ]; then echo "base map present"; else python3 tools/build_geo_base.py; fi
      - name: Verify extraction and binary format contracts
        run: python3 -m unittest discover -s tools/tests -v
      - name: One-off OSM roads and Hamburg detail extract (ODbL, cached in repo)
        run: |
          python3 tools/build_osm_roads.py
          python3 tools/pack_geo.py
      - name: Commit generated asset
        if: always()
        run: |
          git config user.name "geo-data-bot"
          git config user.email "geo-data-bot@users.noreply.github.com"
          git add app/src/main/native_assets/geo/ data/osm/
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "geo: offline base map and OSM road extracts $(ls data/osm/roads-*.json 2>/dev/null | wc -l)/16 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
