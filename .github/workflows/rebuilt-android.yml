name: Rebuilt Android
on:
  push:
    branches: ['codex/operator-rebuilt-v020']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuilt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_APK: release/Einsatzleitstelle110-Operator-v0.20.0-Rebuilt.apk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint native app, run JVM tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Validate offline geographic data contracts
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify native APK and signer's certificate
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "$APP_APK"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk release/instrumentation.apk
          python3 scripts/verify_native_apk.py "$APP_APK" | tee release/package-audit.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APP_APK" | tee release/signing.txt
          (cd release && sha256sum "$(basename "$APP_APK")") | tee release/SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline native device tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash .github/scripts/native-device-check.sh
      - name: Publish native development preview after offline launch
        if: ${{ success() && github.event_name == 'push' && github.ref_name == 'codex/operator-rebuilt-v020' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! -s runtime/launch.txt || ! -s "$APP_APK" ]] || ! grep -q '^Status: ok' runtime/launch.txt; then
            echo 'Vorschau erfordert eine APK mit geprüftem Offline-Start.'
            exit 0
          fi
          version=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APP_APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          if [[ ! "$version" =~ ^0[.]20[.]0-rebuilt-preview[.]([0-9]+)$ ]]; then
            echo "Ungültige Rebuilt-Vorschauversion: $version" >&2
            exit 1
          fi
          tag="v$version"
          preview="${BASH_REMATCH[1]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Diese Vorschau ist bereits veröffentlicht.'
            exit 0
          fi
          cp docs/REBUILT_PROGRESS.md release/Entwicklungsstand.md
          cp runtime/launch.txt release/Offline-Start.txt
          cp runtime/preview-launch.png release/Preview-Start.png
          if [[ -f runtime/instrumentation.txt ]]; then cp runtime/instrumentation.txt release/Geraetetests.txt; fi
          tar -czf release/Pruefberichte.tar.gz -C app/build test-results reports
          assets=("$APP_APK" release/SHA256SUMS.txt release/package-audit.json release/signing.txt
            release/Entwicklungsstand.md release/Offline-Start.txt release/Preview-Start.png release/Pruefberichte.tar.gz)
          if [[ -f release/Geraetetests.txt ]]; then assets+=(release/Geraetetests.txt); fi
          if [[ -d runtime/screens ]]; then
            tar -czf release/Emulator-Screenshots.tar.gz -C runtime screens
            assets+=(release/Emulator-Screenshots.tar.gz)
          fi
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --prerelease \
            --title "EINSATZLEITSTELLE 110 – Operator Rebuilt 0.20.0 (Preview $preview)" \
            --notes-file docs/REBUILT_PREVIEW_RELEASE.md
      - name: Upload check results and APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: operator-rebuilt-native
          retention-days: 7
          path: |
            release/
            runtime/
            app/build/test-results/
            app/build/reports/
