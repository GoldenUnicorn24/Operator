name: Rebuilt Android
on:
  push:
    branches: ['codex/operator-rebuilt-v020']
  pull_request:
    branches: ['claude/operator-notruf']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuilt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APP_APK: release/Einsatzleitstelle110-Operator-v0.20.0-Rebuilt.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint native app, run JVM tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Validate offline geographic data contracts
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify native APK and signer's certificate
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "$APP_APK"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk release/instrumentation.apk
          python3 scripts/verify_native_apk.py "$APP_APK" | tee release/package-audit.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APP_APK" | tee release/signing.txt
          (cd release && sha256sum "$(basename "$APP_APK")") | tee release/SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline native device tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash .github/scripts/native-device-check.sh
      - name: Upload check results and APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: operator-rebuilt-native
          retention-days: 7
          path: |
            release/
            runtime/
            app/build/test-results/
            app/build/reports/
