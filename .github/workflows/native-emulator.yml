name: Native Android Emulator Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/native_assets/**'
      - '.github/workflows/native-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile and run native app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n de.einsatzleitstelle110/.MainActivity
            sleep 15
            mkdir -p screenshots
            adb shell screencap -p /sdcard/OperatorNativeV1.png
            adb pull /sdcard/OperatorNativeV1.png screenshots/OperatorNativeV1.png
            adb logcat -d -b crash > screenshots/crash-log.txt
            if grep -q "FATAL EXCEPTION" screenshots/crash-log.txt; then cat screenshots/crash-log.txt; exit 1; fi
      - name: Upload native screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Einsatzleitstelle110-native-emulator-screenshot
          path: screenshots/
          if-no-files-found: warn
